<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>INVADERS RETRO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="cabinet">
    <header class="hud">
      <a class="back" href="../index.html">‹ JOGOS</a>
      <div class="title">◉ INVADERS</div>
      <div class="stats">
        <span>PONTOS <b id="score">0</b></span>
        <span>VIDAS <b id="lives">3</b></span>
        <span>FASE <b id="level">1</b></span>
      </div>
    </header>
    <div class="screen-wrap" id="touch-zone">
      <canvas id="game" width="400" height="480"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlay-title">TOQUE PARA COMEÇAR</p>
        <p class="hint">← → / arraste move · ESPAÇO / toque atira · ESC volta</p>
      </div>
    </div>
    <div class="touch-ui">
      <div class="actions">
        <button class="tbtn small" id="btn-fire" aria-label="atirar"><svg viewBox="0 0 24 24" width="30" height="30" style="vertical-align:middle"><path d="M12 1.5c1.2 4.2-2.8 6.2-2.8 11a4.8 4.8 0 0 0 9.6 0c0-2-1-3.4-2-4.8-.5 1.4-1.4 1.9-2.4 1.9.3-2.7-1-6-2.4-8.1z" fill="#ff7b1c"/><path d="M12 21.5a3.1 3.1 0 0 1-3.1-3.1c0-2.3 2.3-3.3 3.1-5.8 1 2.5 3.1 3.5 3.1 5.8A3.1 3.1 0 0 1 12 21.5z" fill="#ffd23f"/></svg></button>
      </div>
      <div class="dpad">
        <button class="tbtn left" data-dir="left" aria-label="esquerda">◀</button>
        <button class="tbtn right" data-dir="right" aria-label="direita">▶</button>
      </div>
    </div>
    <footer class="controls">
      <span>⬅➡ mover</span>
      <span><b>ESPAÇO</b> atira/pausa</span>
      <span><b>R</b> reinicia</span>
      <span><b>ESC</b> volta</span>
      <span>⚠ cada fase: +inimigos, tiro mirado, rajada dupla</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
