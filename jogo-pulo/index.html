<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>PULO RETRO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="cabinet">
    <header class="hud">
      <a class="back" href="../index.html">‹ JOGOS</a>
      <div class="title">◉ PULO RETRO</div>
      <div class="stats">
        <span>PONTOS <b id="score">0</b></span>
        <span>NÍVEL <b id="tier">1</b></span>
        <span>RECORDE <b id="hiscore">0</b></span>
      </div>
    </header>
    <div class="screen-wrap" id="touch-zone">
      <canvas id="game" width="400" height="300"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlay-title">TOQUE OU ESPAÇO PARA PULAR</p>
        <p class="hint">Toque / ESPAÇO / ↑ pula (até 2x) · ESC volta</p>
      </div>
    </div>
    <footer class="controls">
      <span><b>ESPAÇO/↑/toque</b> pula</span>
      <span><b>R</b> reinicia</span>
      <span><b>ESC</b> volta</span>
      <span>⚠ a cada 1000 pts o nível sobe</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
