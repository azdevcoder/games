<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAMES — Selecione o jogo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a; color: #33ff66;
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 16px;
    }
    .cabinet {
      background: #111; border: 4px solid #2a2a2a; border-radius: 12px;
      padding: 24px; width: min(92vw, 560px); text-align: center;
      box-shadow: 0 0 40px rgba(51,255,102,.15);
    }
    h1 { letter-spacing: 4px; text-shadow: 0 0 8px #33ff66; margin-bottom: 6px; }
    p.sub { color: #9dffb8; font-size: 13px; margin-bottom: 20px; }
    .grid { display: grid; gap: 12px; }
    a.card {
      display: block; text-decoration: none; color: #33ff66;
      background: #000; border: 2px solid #33ff66; padding: 16px;
      font-weight: bold; transition: transform .1s, background .1s;
    }
    a.card:hover { background: #062b12; transform: scale(1.01); }
    a.card small { display: block; font-weight: normal; color: #9dffb8; margin-top: 6px; font-size: 12px; }
    footer { margin-top: 16px; font-size: 12px; color: #9dffb8; }
  </style>
</head>
<body>
  <main class="cabinet">
    <h1>◉ GAMES</h1>
    <p class="sub">Selecione um jogo para jogar</p>
    <div class="grid">
      <a class="card" href="jogo-cobrinha/index.html">
        🐍 SNAKE RETRO
        <small>Setas movem · R reinicia · V velocidade · T tela cheia · ENTER/ESPAÇO pausa · atravessa parede</small>
      </a>
    </div>
    <footer>Adicione novos jogos como pastas neste repo e linke aqui.</footer>
  </main>
</body>
</html>
