<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>CAMPO MINADO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="cabinet">
    <header class="hud">
      <a class="back" href="../index.html">‹ JOGOS</a>
      <div class="title">◉ MINADO</div>
      <div class="stats">
        <span><svg class="ic" viewBox="0 0 24 24"><path d="M14.5 9.5L18 6" stroke="#9dffb8" stroke-width="2" stroke-linecap="round"/><path d="M20.5 2.5v4M18.5 4.5h4" stroke="#ffee33" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="15" r="6.5" fill="#1a2b1a" stroke="#33ff66" stroke-width="1.8"/><circle cx="7.8" cy="12.8" r="1.5" fill="#9dffb8"/></svg> <b id="mines">10</b></span>
        <span><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="#33ff66" stroke-width="2"/><path d="M12 9v4l3 2" stroke="#33ff66" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M9 2.5h6" stroke="#33ff66" stroke-width="2" stroke-linecap="round"/></svg> <b id="time">0</b>s</span>
        <span id="status"></span>
      </div>
    </header>
    <div class="toolbar">
      <button id="btn-mode" class="mode" aria-label="alternar modo"></button>
      <button id="btn-new" class="mode" aria-label="novo jogo">↻ NOVO</button>
    </div>
    <div class="diffbar" role="group" aria-label="tamanho do campo">
      <button class="diff size active" data-size="9">9×9</button>
      <button class="diff size" data-size="12">12×12</button>
      <button class="diff size" data-size="16">16×16</button>
      <button class="diff size" data-size="20">20×20</button>
    </div>
    <div class="diffbar" role="group" aria-label="quantidade de bombas">
      <button class="diff bomb" data-mines="5"><svg viewBox="0 0 24 24" width="15" height="15" style="vertical-align:-2px"><circle cx="10" cy="15" r="6.5" fill="#1a2b1a" stroke="#33ff66" stroke-width="2"/><path d="M14.5 9.5L18 6" stroke="#9dffb8" stroke-width="2" stroke-linecap="round"/><path d="M20.5 2.5v4M18.5 4.5h4" stroke="#ffee33" stroke-width="1.8" stroke-linecap="round"/></svg> 5</button>
      <button class="diff bomb active" data-mines="10"><svg viewBox="0 0 24 24" width="15" height="15" style="vertical-align:-2px"><circle cx="10" cy="15" r="6.5" fill="#1a2b1a" stroke="#33ff66" stroke-width="2"/><path d="M14.5 9.5L18 6" stroke="#9dffb8" stroke-width="2" stroke-linecap="round"/><path d="M20.5 2.5v4M18.5 4.5h4" stroke="#ffee33" stroke-width="1.8" stroke-linecap="round"/></svg> 10</button>
      <button class="diff bomb" data-mines="12"><svg viewBox="0 0 24 24" width="15" height="15" style="vertical-align:-2px"><circle cx="10" cy="15" r="6.5" fill="#1a2b1a" stroke="#33ff66" stroke-width="2"/><path d="M14.5 9.5L18 6" stroke="#9dffb8" stroke-width="2" stroke-linecap="round"/><path d="M20.5 2.5v4M18.5 4.5h4" stroke="#ffee33" stroke-width="1.8" stroke-linecap="round"/></svg> 12</button>
      <button class="diff bomb" data-mines="15"><svg viewBox="0 0 24 24" width="15" height="15" style="vertical-align:-2px"><circle cx="10" cy="15" r="6.5" fill="#1a2b1a" stroke="#33ff66" stroke-width="2"/><path d="M14.5 9.5L18 6" stroke="#9dffb8" stroke-width="2" stroke-linecap="round"/><path d="M20.5 2.5v4M18.5 4.5h4" stroke="#ffee33" stroke-width="1.8" stroke-linecap="round"/></svg> 15</button>
      <button class="diff bomb" data-mines="20"><svg viewBox="0 0 24 24" width="15" height="15" style="vertical-align:-2px"><circle cx="10" cy="15" r="6.5" fill="#1a2b1a" stroke="#33ff66" stroke-width="2"/><path d="M14.5 9.5L18 6" stroke="#9dffb8" stroke-width="2" stroke-linecap="round"/><path d="M20.5 2.5v4M18.5 4.5h4" stroke="#ffee33" stroke-width="1.8" stroke-linecap="round"/></svg> 20</button>
    </div>
    <div id="board" class="board"></div>
    <div id="overlay" class="overlay hidden">
      <p id="overlay-title"></p>
      <p class="hint">Toque em NOVO ou aqui para recomeçar · ESC volta</p>
    </div>
    <footer class="controls">
      <span><b>Clique</b> revela · <b>botão direito / segurar</b> marca <svg class="ic" viewBox="0 0 24 24"><path d="M6 21V3" stroke="#9dffb8" stroke-width="2" stroke-linecap="round"/><path d="M6 3.5h12l-3.5 4.5L18 12.5H6z" fill="#ff3b30"/></svg></span>
      <span><b>R</b> novo jogo · <b>ESC</b> volta</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
